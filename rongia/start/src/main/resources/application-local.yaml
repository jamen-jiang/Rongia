# 本地环境配置

rongia:
  # 默认角色 ID（新用户注册时自动分配）
  default-role-id: 1
  # 管理员 ID
  admin-id: 1
  # 附件地址
  attachment-url: "http://${HOST:localhost}:2020"

spring:
  # 数据源配置
  datasource:
    # SQL Server 驱动
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # JDBC 连接地址：jdbc:sqlserver://主机:端口;databaseName=数据库名;其他参数
    url: jdbc:sqlserver://${HOST:localhost};databaseName=rongia;encrypt=true;trustServerCertificate=true;
    # 用户名
    username: sa
    # 密码
    password: 19911004
    # HikariCP 连接池配置
    hikari:
      # 最大连接数
      maximum-pool-size: 512

  # Redis 配置
  data:
    redis:
      # Redis 主机
      host: ${HOST:localhost}
      # Redis 端口
      port: 6379
      # 数据库索引
      database: 0
      # 密码（有密码时配置）
      # password: your-password

# FTP配置
ftp:
  # FTP主机
  host: ${HOST:localhost}
  # FTP端口
  port: 21
  # FTP用户名
  username: RONGIA
  # FTP密码
  password: aETEzspAjAKS